services:
  app:
    image: ${IMAGE:?IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/taskflow.db
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      BYPASS_AUTH: "false"
    volumes:
      - taskflow-data:/data
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  taskflow-data:
  caddy-data:
  caddy-config:
