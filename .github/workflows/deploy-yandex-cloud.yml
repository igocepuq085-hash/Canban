name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.YC_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.YC_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload deployment configuration
        env:
          DEPLOY_HOST: ${{ secrets.YC_VM_HOST }}
          DEPLOY_USER: ${{ secrets.YC_VM_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/taskflow"
          scp deploy/docker-compose.prod.yml deploy/Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:~/taskflow/"

      - name: Deploy release
        env:
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          DEPLOY_HOST: ${{ secrets.YC_VM_HOST }}
          DEPLOY_USER: ${{ secrets.YC_VM_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.metadata.outputs.tags }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          printf 'IMAGE=%s\nAPP_DOMAIN=%s\nSESSION_SECRET=%s\n' "$IMAGE" "$APP_DOMAIN" "$SESSION_SECRET" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; cat > ~/taskflow/.env"
          printf '%s' "$GHCR_TOKEN" \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" "docker login ghcr.io --username '${{ github.repository_owner }}' --password-stdin"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd ~/taskflow && docker compose --env-file .env -f docker-compose.prod.yml pull && docker compose --env-file .env -f docker-compose.prod.yml up -d --remove-orphans"
          sleep 15
          curl --fail --silent --show-error --retry 12 --retry-delay 10 "https://$APP_DOMAIN/api/health"
